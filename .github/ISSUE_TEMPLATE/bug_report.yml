name: Bug report
description: Something is broken
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please confirm the problem on the current image before reporting.
        Re-running the install command upgrades in place and keeps your data.

        **Found a security issue?** Do not file it here — see
        [SECURITY.md](https://github.com/TorrenClou/.github/blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a magnet link for ...
        2. Select two files
        3. Upload to S3
        4. The job stays in Queued
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: "Run: docker inspect --format '{{ index .Config.Labels \"org.opencontainers.image.version\" }}' torrencloud"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - install.sh / install.ps1 (all-in-one image)
        - docker run, by hand
        - Docker Compose
        - A PaaS (Dokploy, Coolify, Railway, Render)
        - Built from source
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "docker logs --tail 100 torrencloud — redact anything sensitive."
      render: shell
